    <script>
      // Entrance animations only start hidden under html.js. If animation frames are not
      // being produced (throttled tab, battery saver, embedded pane), drop the class so
      // content is shown immediately instead of waiting on stalled animations.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var frames = 0;
        requestAnimationFrame(function () {
          frames++;
          requestAnimationFrame(function () { frames++; });
        });
        setTimeout(function () {
          if (frames < 2) root.classList.remove("js");
        }, 1500);
      })();
    </script>
    <link rel="preload" as="image" href="/avatar.webp" type="image/webp" fetchpriority="high" />
